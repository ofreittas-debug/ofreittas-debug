<svg
  width="100%"
  height="220"
  viewBox="0 0 850 220"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="headerTitle headerDesc"
>
  <title id="headerTitle">Alisson Freitas - Desenvolvedor Full-Stack & Engenharia de Software</title>
  <desc id="headerDesc">Banner oficial de Alisson Freitas, Desenvolvedor Full-Stack e Engenheiro de Software</desc>

  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Brilho Ambiente Esquerdo (Azul/Ciano) -->
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100, 110) rotate(45) scale(220 180)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilho Ambiente Direito (Bordô Premium AF Stack) -->
    <radialGradient id="glowWine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(750, 60) rotate(135) scale(260 200)">
      <stop offset="0%" stop-color="#8B1E2D" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6b1420" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B1E2D" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente do Texto do Nome -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Gradiente do Pill de Destaque -->
    <linearGradient id="pillGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B1E2D"/>
      <stop offset="100%" stop-color="#c5283d"/>
    </linearGradient>

    <!-- Gradiente de Borda Suave do Card de Status -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="270" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Padrão de Grade Tecnológica -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.18"/>
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .title-name {
      font: 800 32px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .role-text {
      font: 600 15px 'Segoe UI', Inter, -apple-system, sans-serif;
      fill: #38bdf8;
      letter-spacing: 0.2px;
    }
    .subtitle-text {
      font: 400 13px 'Segoe UI', Inter, -apple-system, sans-serif;
      fill: #94a3b8;
    }
    .pill-badge {
      font: 700 10px 'Segoe UI', Inter, sans-serif;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .status-title {
      font: 600 12px 'Segoe UI', Inter, sans-serif;
      fill: #f8fafc;
    }
    .status-sub {
      font: 400 11px 'Segoe UI', Inter, sans-serif;
      fill: #94a3b8;
    }
    .tech-pill {
      font: 500 10.5px 'JetBrains Mono', 'Fira Code', monospace;
      fill: #cbd5e1;
    }
  </style>

  <!-- Fundo com Borda Refinada -->
  <rect x="1" y="1" width="848" height="218" rx="10" fill="url(#bgGradient)" stroke="#e4e2e2" stroke-width="1.2" stroke-opacity="0.9"/>

  <!-- Luzes de Ambiente -->
  <rect x="1" y="1" width="848" height="218" rx="10" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="848" height="218" rx="10" fill="url(#glowWine)"/>

  <!-- Grade Sutil -->
  <rect x="1" y="1" width="848" height="218" rx="10" fill="url(#grid)"/>

  <!-- ==================== LADO ESQUERDO: APRESENTAÇÃO ==================== -->
  <g transform="translate(36, 32)">
    <!-- Pill Superior: Engenharia de Software -->
    <g>
      <rect x="0" y="0" width="235" height="22" rx="11" fill="url(#pillGrad)" />
      <circle cx="12" cy="11" r="3.5" fill="#ffffff" />
      <text x="24" y="14.5" class="pill-badge">ENGENHARIA DE SOFTWARE</text>
    </g>

    <!-- Nome Principal -->
    <text x="0" y="58" class="title-name">Alisson Freittas</text>

    <!-- Cargo Principal com Destaque -->
    <text x="0" y="82" class="role-text">Desenvolvedor Full-Stack • Arquiteto de Software Web</text>

    <!-- Subtítulo de Posicionamento -->
    <text x="0" y="104" class="subtitle-text">Construindo aplicações modernas, SaaS escaláveis e sistemas corporativos seguros.</text>

    <!-- Chips das Tecnologias Centrais -->
    <g transform="translate(0, 126)">
      <!-- Chip 1: TypeScript -->
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="12" r="3" fill="#3178c6"/>
      <text x="18" y="16" class="tech-pill">TypeScript</text>

      <!-- Chip 2: Next.js / React -->
      <rect x="93" y="0" width="98" height="24" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="103" cy="12" r="3" fill="#61dafb"/>
      <text x="111" y="16" class="tech-pill">Next.js • React</text>

      <!-- Chip 3: Node / PostgreSQL -->
      <rect x="199" y="0" width="124" height="24" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="209" cy="12" r="3" fill="#336791"/>
      <text x="217" y="16" class="tech-pill">PostgreSQL • RLS</text>

      <!-- Chip 4: Tailwind CSS -->
      <rect x="331" y="0" width="95" height="24" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="341" cy="12" r="3" fill="#38bdf8"/>
      <text x="349" y="16" class="tech-pill">Tailwind CSS</text>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: CARD DE STATUS & AUTORIDADE ==================== -->
  <g transform="translate(535, 28)">
    <!-- Cartão de Fundo Efeito Glass -->
    <rect x="0" y="0" width="280" height="164" rx="10" fill="#111622" fill-opacity="0.88" stroke="url(#cardBorder)" stroke-width="1.2"/>

    <!-- Item 1: Disponibilidade -->
    <g transform="translate(18, 22)">
      <circle cx="7" cy="7" r="5" fill="#22c55e" fill-opacity="0.25"/>
      <circle cx="7" cy="7" r="3" fill="#22c55e"/>
      <text x="22" y="7" class="status-title">Disponível para Oportunidades</text>
      <text x="22" y="21" class="status-sub">Projetos Sob Demanda • CLT / PJ</text>
    </g>

    <!-- Linha Divisória 1 -->
    <line x1="18" y1="58" x2="262" y2="58" stroke="#334155" stroke-opacity="0.4" stroke-width="0.8"/>

    <!-- Item 2: Localização & Formato -->
    <g transform="translate(18, 70)">
      <!-- Ícone Pin -->
      <path d="M 7 2 C 4.5 2 2.5 4 2.5 6.5 C 2.5 10 7 14 7 14 C 7 14 11.5 10 11.5 6.5 C 11.5 4 9.5 2 7 2 Z" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="7" cy="6.5" r="1.5" fill="#38bdf8"/>
      <text x="22" y="7" class="status-title">Sorocaba, SP — Brasil</text>
      <text x="22" y="21" class="status-sub">Atuação Presencial, Híbrida ou Remota</text>
    </g>

    <!-- Linha Divisória 2 -->
    <line x1="18" y1="108" x2="262" y2="108" stroke="#334155" stroke-opacity="0.4" stroke-width="0.8"/>

    <!-- Item 3: Estúdio Próprio -->
    <g transform="translate(18, 120)">
      <!-- Ícone Rocket -->
      <path d="M 7 2 C 7 2 11 4 11 9 L 9 11 L 3 11 L 3 9 C 3 4 7 2 7 2 Z" fill="none" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="22" y="7" class="status-title">Fundador @ AF Stack Studio</text>
      <text x="22" y="21" class="status-sub">Engenharia de Software & SaaS</text>
    </g>
  </g>
</svg>
