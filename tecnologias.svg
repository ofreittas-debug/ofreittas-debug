<svg
  width="300"
  height="195"
  viewBox="0 0 300 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Tecnologias mais usadas nos projetos de Alisson Freitas</title>
  <desc id="descId">TypeScript 52.0%, React 20.0%, Tailwind CSS 14.0%, JavaScript 6.0%, PostgreSQL 4.8%, Python 3.2%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.5s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="1"
    y="1"
    rx="5"
    height="193"
    width="298"
    stroke="#e4e2e2"
    stroke-width="1.5"
    stroke-opacity="1"
    fill="#1a1b27"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Tecnologias</text>
    </g>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <!-- Barra de Progresso com cantos arredondados -->
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>

      <!-- Segmentos da Barra (Total = 250px) - Cores 100% distintas -->
      <!-- TypeScript (Azul mantido): 130px (52.0%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0" y="0" width="130" height="8" fill="#3178c6" />
      <!-- React (Roxo/Púrpura vibrante): 50px (20.0%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="130" y="0" width="50" height="8" fill="#a855f7" />
      <!-- Tailwind CSS (Verde Esmeralda): 35px (14.0%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="180" y="0" width="35" height="8" fill="#10b981" />
      <!-- JavaScript (Amarelo Ouro): 15px (6.0%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="215" y="0" width="15" height="8" fill="#f1e05a" />
      <!-- PostgreSQL (Laranja Intenso): 12px (4.8%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="230" y="0" width="12" height="8" fill="#ff7a00" />
      <!-- Python (Rosa/Coral): 8px (3.2%) -->
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="242" y="0" width="8" height="8" fill="#f43f5e" />

      <!-- Legendas em 2 Colunas com as novas cores distintas -->
      <g transform="translate(0, 25)">
        <!-- Coluna 1 -->
        <g transform="translate(0, 0)">
          <g class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="6" r="5" fill="#3178c6" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 52.0%</text>
          </g>
        </g>
        <g transform="translate(0, 25)">
          <g class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="6" r="5" fill="#a855f7" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">React 20.0%</text>
          </g>
        </g>
        <g transform="translate(0, 50)">
          <g class="stagger" style="animation-delay: 750ms">
            <circle cx="5" cy="6" r="5" fill="#10b981" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">Tailwind CSS 14.0%</text>
          </g>
        </g>

        <!-- Coluna 2 -->
        <g transform="translate(125, 0)">
          <g class="stagger" style="animation-delay: 900ms">
            <circle cx="5" cy="6" r="5" fill="#f1e05a" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript 6.0%</text>
          </g>
        </g>
        <g transform="translate(125, 25)">
          <g class="stagger" style="animation-delay: 1050ms">
            <circle cx="5" cy="6" r="5" fill="#ff7a00" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">PostgreSQL 4.8%</text>
          </g>
        </g>
        <g transform="translate(125, 50)">
          <g class="stagger" style="animation-delay: 1200ms">
            <circle cx="5" cy="6" r="5" fill="#f43f5e" />
            <text data-testid="lang-name" x="15" y="10" class="lang-name">Python 3.2%</text>
          </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
